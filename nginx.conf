server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # The SPA shell and the story index must never be cached — a rebuild
  # changes them in place and stale copies break the whole app.
  location = /index.html { add_header Cache-Control "no-store"; }
  location = /index.json { add_header Cache-Control "no-store"; }
  location = /build-info.json { add_header Cache-Control "no-store"; }
  location = /iframe.html { add_header Cache-Control "no-store"; }
  location ~* ^/(project\.json|stories\.json|sb-.*)$ { add_header Cache-Control "no-store"; }

  # Hashed build assets are immutable.
  location /assets/ {
    add_header Cache-Control "public, max-age=604800, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff2;
  gzip_min_length 1024;
}
