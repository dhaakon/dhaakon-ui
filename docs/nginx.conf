server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Routing is hash-based, so only the shell is ever requested — but it must
  # never be cached, or a rebuild leaves stale asset references behind.
  location = /index.html { add_header Cache-Control "no-store"; }

  location /assets/ {
    add_header Cache-Control "public, max-age=604800, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff2;
  gzip_min_length 1024;
}
